name: Deploy Pages (prod + test)
on:
  push:
    branches: [main, dev]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: prod }
      - uses: actions/checkout@v4
        with: { ref: dev, path: dev }
      - name: Assemble site (prod at /, dev at /test/)
        run: |
          mkdir -p _site/test
          cp prod/index.html _site/index.html
          cp dev/index.html _site/test/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: dep
        uses: actions/deploy-pages@v4
